name: Сбор вакансий

on:
  schedule:
    - cron: "0 6 * * *"    # каждый день: сайт обещает свежесть, раз в неделю её не даёт
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: pip install requests

      - name: Собрать вакансии
        run: python collect.py
        env:
          # Ключ бота и адрес канала лежат в секретах репозитория,
          # в коде их нет. Если секретов нет — постинг просто не работает.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}

      - name: Закоммитить обновление
        run: |
          git config user.name "jobs-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Вакансии: обновление $(date +%F)"
            git push
          fi
