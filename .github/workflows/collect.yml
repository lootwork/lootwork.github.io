name: Сбор вакансий

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: pip install requests

      - name: Собрать вакансии
        run: python collect.py

      - name: Закоммитить обновление
        run: |
          git config user.name "jobs-bot"
          git config user.email "actions@github.com"
          git add jobs.js sitemap.xml
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Вакансии: обновление $(date +%F)"
            git push
          fi
