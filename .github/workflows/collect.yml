name: Сбор вакансий

on:
  schedule:
    - cron: "0 6 * * *"    # каждый день: сайт обещает свежесть, раз в неделю её не даёт
  workflow_dispatch:
    inputs:
      post:
        description: "Публиковать новые вакансии в Telegram"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставить зависимости
        run: pip install requests pillow

      - name: Собрать вакансии
        run: python collect.py
        env:
          # Ключ бота и адрес канала лежат в секретах репозитория,
          # в коде их нет. Если секретов нет — постинг просто не работает.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          # По расписанию публикуем всегда, вручную — только по галочке
          TG_POST: ${{ (github.event_name == 'schedule' || inputs.post) && '1' || '0' }}

      - name: Закоммитить обновление
        run: |
          git config user.name "jobs-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Вакансии: обновление $(date +%F)"
            # Пока шёл сбор, в репозиторий могли залить файлы руками.
            # Тогда обычная отправка отклоняется — сначала забираем чужие
            # изменения, свои кладём поверх, и только потом отправляем.
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && exit 0
              echo "Попытка $i не прошла, пробую ещё раз"
              sleep 5
            done
            echo "Не удалось отправить результат"
            exit 1
          fi
